{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="{% static 'images/newlogotext-removebg-preview.png' %}" type="image/x-icon">
    
    <title>Feedback for {{ event.title }}</title>
    <style>
        .feedback-form {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .rating {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .star {
            cursor: pointer;
            font-size: 24px;
            color: #ccc;
        }
        .star.selected { color: gold; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="feedback-form">
        <h1>Feedback: {{ event.title }}</h1>
        <form method="post" action="{% url 'submit_feedback' event.id %}">
            {% csrf_token %}
            
            <label>Rating:</label>
            <div class="rating">
                {% for i in "12345" %}
                    <div class="star" data-value="{{ i }}">★</div>
                {% endfor %}
                <input type="hidden" name="rating" id="rating-input" required>
            </div>
            
            <label>Comments:</label>
            <textarea name="comment" placeholder="Your feedback..."></textarea>
            
            <button type="submit">Submit Feedback</button>
        </form>
    </div>

    <script>
        // Star rating selection
        const stars = document.querySelectorAll('.star');
        const ratingInput = document.getElementById('rating-input');
        
        stars.forEach(star => {
            star.addEventListener('click', () => {
                const value = star.getAttribute('data-value');
                ratingInput.value = value;
                
                // Update star display
                stars.forEach(s => {
                    s.classList.toggle(
                        'selected', 
                        s.getAttribute('data-value') <= value
                    );
                });
            });
        });
    </script>
</body>
</html>
